name: 🏗️ DAWAI — Build & Deploy

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  eas-build:
    name: EAS Build (APK كامل)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm install --legacy-peer-deps

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: EAS Build — APK كامل
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build \
            --platform android \
            --profile production \
            --non-interactive \
            --no-wait \
            --message "Build #${{ github.run_number }} — ${{ github.event.head_commit.message }}"

      - name: انتظر اكتمال البناء وحمّل الـ APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          echo "⏳ انتظار اكتمال EAS Build..."

          for i in $(seq 1 30); do
            sleep 60
            STATUS=$(eas build:list \
              --platform android \
              --limit 1 \
              --non-interactive \
              --json 2>/dev/null | python3 -c "
import sys,json
builds=json.load(sys.stdin)
if builds:
    b=builds[0]
    print(b.get('status','unknown'))
" || echo "unknown")

            echo "[$i/30] Status: $STATUS"

            if [ "$STATUS" = "FINISHED" ]; then
              APK_URL=$(eas build:list \
                --platform android \
                --limit 1 \
                --non-interactive \
                --json 2>/dev/null | python3 -c "
import sys,json
builds=json.load(sys.stdin)
if builds:
    print(builds[0].get('artifacts',{}).get('buildUrl',''))
")
              echo "APK_URL=$APK_URL" >> $GITHUB_ENV
              echo "✅ APK جاهز: $APK_URL"
              break
            fi

            if [ "$STATUS" = "ERRORED" ] || [ "$STATUS" = "CANCELED" ]; then
              echo "❌ EAS Build فشل"
              exit 1
            fi
          done

      - name: حمّل الـ APK وارفعه كـ Release
        if: env.APK_URL != ''
        run: |
          curl -L -o dawai-v${{ github.run_number }}.apk "${{ env.APK_URL }}"

          OLD_ID=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/latest-debug" | \
            python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('id',''))" 2>/dev/null || true)

          if [ -n "$OLD_ID" ] && [ "$OLD_ID" != "None" ]; then
            curl -s -X DELETE -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/releases/$OLD_ID" || true
            curl -s -X DELETE -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/git/refs/tags/latest-debug" || true
          fi

          RELEASE=$(curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${{ github.repository }}/releases" \
            -d "{\"tag_name\":\"latest-debug\",\"name\":\"DAWAI — Build #${{ github.run_number }}\",\"body\":\"بناء كامل عبر EAS\",\"prerelease\":true}")

          UPLOAD_URL=$(echo "$RELEASE" | python3 -c "import sys,json; print(json.load(sys.stdin)['upload_url'].split('{')[0])")

          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @"dawai-v${{ github.run_number }}.apk" \
            "${UPLOAD_URL}?name=dawai-v${{ github.run_number }}.apk"

          echo "✅ APK رُفع على GitHub Releases"

      - name: سجّل النتيجة
        if: always()
        run: |
          if [ -n "${{ env.APK_URL }}" ]; then
            echo "✅ EAS BUILD SUCCESS — Run #${{ github.run_number }}" > build-error.log
            echo "APK: ${{ env.APK_URL }}" >> build-error.log
          else
            echo "❌ EAS BUILD FAILED — Run #${{ github.run_number }}" > build-error.log
          fi
          git config user.email "ci@github.com"
          git config user.name "GitHub Actions"
          git pull --rebase origin main || true
          git add build-error.log
          git diff --cached --quiet || git commit -m "ci: build result #${{ github.run_number }} [ci skip]"
          git push origin main || true

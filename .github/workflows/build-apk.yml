name: 🏗️ Build DAWAI APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: 📦 Install dependencies
        run: npm install --legacy-peer-deps

      - name: 🔍 Verify node_modules
        run: |
          test -d node_modules/@react-native/gradle-plugin && echo "✅ gradle-plugin OK" || (echo "❌ MISSING" && exit 1)

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: 📱 Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.1.12297006"

      - name: 🔥 Setup Firebase (google-services.json)
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json
          else
            echo "⚠️ GOOGLE_SERVICES_JSON غير موجود"
          fi

      - name: 🗺️ Setup Maps API Key
        run: |
          if [ -n "${{ secrets.MAPS_API_KEY }}" ]; then
            sed -i 's/YOUR_MAPS_API_KEY/${{ secrets.MAPS_API_KEY }}/g' \
              android/app/src/main/AndroidManifest.xml
          fi

      - name: 🔤 Copy vector-icons fonts
        run: |
          mkdir -p android/app/src/main/assets/fonts
          cp node_modules/react-native-vector-icons/Fonts/*.ttf \
            android/app/src/main/assets/fonts/ 2>/dev/null || true

      - name: 🔑 Create Debug Keystore
        run: |
          keytool -genkeypair -v \
            -keystore android/app/debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: 🛠️ Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: 🏗️ Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace > /tmp/build.log 2>&1 || true
          echo "=== آخر 150 سطر من السجل ===" 
          tail -150 /tmp/build.log
          # اخرج بنفس كود الخطأ
          grep -q "BUILD SUCCESSFUL" /tmp/build.log && exit 0 || exit 1

      - name: 📋 Upload Build Log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-v${{ github.run_number }}
          path: /tmp/build.log
          retention-days: 7

      - name: 📤 Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DAWAI-debug-v${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: 📊 Build Summary
        if: always()
        run: |
          echo "## نتيجة البناء" >> $GITHUB_STEP_SUMMARY
          if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            SIZE=$(du -sh android/app/build/outputs/apk/debug/app-debug.apk | cut -f1)
            echo "✅ APK جاهز — الحجم: $SIZE" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ فشل البناء — حمّل **build-log** من Artifacts لرؤية الخطأ" >> $GITHUB_STEP_SUMMARY
          fi

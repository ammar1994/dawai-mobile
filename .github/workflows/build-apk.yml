name: 🏗️ Build DAWAI APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: 📦 Install dependencies
        run: npm install --legacy-peer-deps

      - name: 🔍 Verify node_modules
        run: |
          test -d node_modules/@react-native/gradle-plugin && echo "✅ OK" || (echo "❌ MISSING" && exit 1)

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: 📱 Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.1.12297006"

      - name: 🔥 Setup Firebase
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json
          fi

      - name: 🗺️ Setup Maps API Key
        run: |
          if [ -n "${{ secrets.MAPS_API_KEY }}" ]; then
            sed -i 's/YOUR_MAPS_API_KEY/${{ secrets.MAPS_API_KEY }}/g' android/app/src/main/AndroidManifest.xml
          fi

      - name: 🔤 Copy vector-icons fonts
        run: |
          mkdir -p android/app/src/main/assets/fonts
          cp node_modules/react-native-vector-icons/Fonts/*.ttf android/app/src/main/assets/fonts/ 2>/dev/null || true

      - name: 🔑 Create Debug Keystore
        run: |
          keytool -genkeypair -v -keystore android/app/debug.keystore -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: 🛠️ Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: 🏗️ Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace > /tmp/build.log 2>&1 || true
          grep -q "BUILD SUCCESSFUL" /tmp/build.log && echo "SUCCESS=true" >> $GITHUB_ENV || echo "SUCCESS=false" >> $GITHUB_ENV

      - name: 💾 Save build log to repo (for debugging)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # استخرج أهم أجزاء السجل
          {
            echo "=== RUN ${{ github.run_number }} — $(date) ==="
            echo "=== ERRORS ==="
            grep -E "FAILURE|error:|Caused by:|What went wrong|Exception|could not" /tmp/build.log | head -40 || echo "(no errors found)"
            echo ""
            echo "=== LAST 100 LINES ==="
            tail -100 /tmp/build.log
          } > /tmp/build-summary.txt
          
          # احسب base64
          LOG_B64=$(base64 -w 0 /tmp/build-summary.txt)
          
          # احصل على SHA إن وجد الملف
          SHA=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/contents/build-debug.log" | \
            python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('sha',''))" 2>/dev/null || echo "")
          
          # ارفع الملف
          if [ -n "$SHA" ]; then
            BODY="{"message":"🔍 build log run ${{ github.run_number }}","content":"$LOG_B64","sha":"$SHA"}"
          else
            BODY="{"message":"🔍 build log run ${{ github.run_number }}","content":"$LOG_B64"}"
          fi
          
          curl -s -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${{ github.repository }}/contents/build-debug.log" \
            -d "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print('✅ Log saved:', d.get('commit',{}).get('sha','ERROR')[:10])"

      - name: ✅ Check result
        run: |
          if [ "$SUCCESS" = "true" ]; then
            echo "✅ BUILD SUCCESS"
            ls -lh android/app/build/outputs/apk/debug/
          else
            echo "❌ BUILD FAILED — check build-debug.log in repo"
            exit 1
          fi

      - name: 📤 Upload APK
        if: env.SUCCESS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: DAWAI-debug-v${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

name: Build DAWAI APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Make node available to Gradle subprocesses
        run: |
          NODE_DIR=$(dirname $(which node))
          echo "$NODE_DIR" >> $GITHUB_PATH
          sudo ln -sf "$(which node)" /usr/local/bin/node || true
          sudo ln -sf "$(which npm)"  /usr/local/bin/npm  || true
          sudo ln -sf "$(which npx)"  /usr/local/bin/npx  || true
          echo "node: $(node --version), npm: $(npm --version)"

      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: 'true'

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.1.12297006"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.gradle') }}
          restore-keys: gradle-

      - name: Setup keystore and local.properties
        run: |
          keytool -genkeypair -v \
            -keystore android/app/debug.keystore \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" 2>/dev/null || true
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Copy vector icon fonts
        run: |
          mkdir -p android/app/src/main/assets/fonts
          cp node_modules/react-native-vector-icons/Fonts/*.ttf \
             android/app/src/main/assets/fonts/ 2>/dev/null || true

      - name: Build Debug APK
        working-directory: android
        env:
          JAVA_TOOL_OPTIONS: "-Xmx4g -XX:MaxMetaspaceSize=512m"
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --info 2>&1 | tee /tmp/build.log
          EXIT=${PIPESTATUS[0]}
          if [ $EXIT -ne 0 ]; then
            echo "::error::Build failed. Key errors:"
            grep -E "error:|Error|FAILURE|Caused by:|What went wrong" /tmp/build.log | \
              grep -v "^[[:space:]]*at " | head -20
            exit 1
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DawaiApp-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30


      - name: Save errors to repo for debugging
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "=== RUN #${{ github.run_number }} | $(date) ==="
            echo "=== KEY ERRORS ==="
            grep -E "^[^/].*error:|error:.*\.kt|error:.*\.java|FAILURE:|Caused by:|> Task|What went wrong|Cannot resolve" \
              /tmp/build.log 2>/dev/null | grep -v "^\s*at " | tail -80
            echo "=== LAST 150 LINES ==="
            tail -150 /tmp/build.log 2>/dev/null
          } > /tmp/key_errors.txt
          CONTENT=$(base64 -w 0 /tmp/key_errors.txt)
          SHA=$(curl -sf -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/contents/build-errors.txt" | \
            python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('sha',''))" 2>/dev/null || echo "")
          BODY="{\"message\":\"ci: errors #${{ github.run_number }} [ci skip]\",\"content\":\"$CONTENT\"}"
          [ -n "$SHA" ] && BODY="{\"message\":\"ci: errors #${{ github.run_number }} [ci skip]\",\"content\":\"$CONTENT\",\"sha\":\"$SHA\"}"
          curl -s -X PUT -H "Authorization: token $GH_TOKEN" -H "Content-Type: application/json" \
            "https://api.github.com/repos/${{ github.repository }}/contents/build-errors.txt" \
            -d "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print('Saved:', d.get('content',{}).get('name','failed'))"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          retention-days: 7

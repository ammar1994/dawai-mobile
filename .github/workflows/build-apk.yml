name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies
        run: |
          rm -f package-lock.json
          npm install --legacy-peer-deps

      - name: Make node available to Gradle
        run: echo "PATH=$(dirname $(which node)):$PATH" >> $GITHUB_ENV

      - name: Fix react-native-screens codegen types
        run: |
          SCREENS_SRC="node_modules/react-native-screens/src"
          if [ -d "$SCREENS_SRC" ]; then
            find "$SCREENS_SRC" -name "*.ts" -exec sed -i 's/ | undefined//g' {} \;
            echo "Patched react-native-screens src/"
          fi

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"

      - name: Setup keystore and local.properties
        run: |
          keytool -genkeypair -v -keystore android/app/debug.keystore \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Copy vector icon fonts
        run: |
          mkdir -p android/app/src/main/assets/fonts
          cp node_modules/react-native-vector-icons/Fonts/*.ttf \
             android/app/src/main/assets/fonts/ 2>/dev/null || true

      - name: Clear autolinking cache
        run: rm -rf android/build/generated/autolinking/

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon \
            -Dkotlin.compiler.execution.strategy=in-process \
            2>&1 | tee /tmp/build.log
          EXIT=${PIPESTATUS[0]}
          echo "=== ERRORS ==="
          grep -E "error:|Error |FAILED|Caused by:|does not exist|cannot find" /tmp/build.log | grep -v "^>" | head -50 || true
          echo "=== LAST 50 LINES ==="
          tail -50 /tmp/build.log
          exit $EXIT
        env:
          JAVA_TOOL_OPTIONS: "-Xmx4g -XX:MaxMetaspaceSize=512m"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DawaiApp-debug-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: /tmp/build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "DawaiApp Debug Build #${{ github.run_number }}"
          files: android/app/build/outputs/apk/debug/*.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

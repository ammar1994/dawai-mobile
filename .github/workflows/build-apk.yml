name: 🏗️ Build DAWAI APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: 📦 Install dependencies
        run: npm install --legacy-peer-deps

      - name: 🔍 Verify gradle-plugin
        run: |
          ls node_modules/@react-native/gradle-plugin/
          echo "✅ gradle-plugin موجود"
          cat android/gradle/wrapper/gradle-wrapper.properties

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: 📱 Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.1.12297006"

      - name: 🔥 google-services.json
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json
          fi
          cat android/app/google-services.json | python3 -c "import sys,json; d=json.load(sys.stdin); print('✅ project_id:', d['project_info']['project_id'])"

      - name: 🗺️ Maps API Key
        run: |
          KEY="${{ secrets.MAPS_API_KEY }}"
          [ -z "$KEY" ] && KEY="AIzaSyDummy_maps_key"
          sed -i "s/YOUR_MAPS_API_KEY/$KEY/g" android/app/src/main/AndroidManifest.xml

      - name: 🔑 Debug Keystore
        run: |
          keytool -genkeypair -v \
            -keystore android/app/debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: 🛠️ local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: 🏗️ Build Debug APK
        working-directory: android
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8"
        run: |
          chmod +x gradlew
          # حذف Gradle cache القديم لضمان استخدام الإصدار الصحيح
          rm -rf $HOME/.gradle/wrapper/dists/gradle-8.7*
          echo "=== Gradle version ==="
          ./gradlew --version
          echo "=== Starting build ==="
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log
          echo "✅ BUILD SUCCESS"
          ls -lh app/build/outputs/apk/debug/

      - name: ❌ Show errors on failure
        if: failure()
        run: |
          echo "====== ERRORS ======"
          grep -n -E "error:|FAILURE|Plugin.*not found|Could not|UnknownPlugin|cannot find symbol|does not exist" \
            /tmp/build.log | grep -v "^\s*at " | head -50 || true
          echo "====== LAST 60 LINES ======"
          tail -60 /tmp/build.log || true

      - name: 📤 Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DAWAI-debug-v${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: 📊 Summary
        if: always()
        run: |
          if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            SIZE=$(du -sh android/app/build/outputs/apk/debug/app-debug.apk | cut -f1)
            echo "✅ APK جاهز — $SIZE" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ فشل البناء" >> $GITHUB_STEP_SUMMARY
          fi

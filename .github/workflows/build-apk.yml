name: Build DAWAI APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Install Node deps
        run: npm install --legacy-peer-deps

      - name: Verify gradle-plugin exists
        run: |
          PLUGIN_DIR="node_modules/@react-native/gradle-plugin"
          if [ ! -d "$PLUGIN_DIR" ]; then
            echo "❌ ERROR: $PLUGIN_DIR not found!"
            exit 1
          fi
          echo "✅ Plugin found: $PLUGIN_DIR"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.1.12297006" \
            "cmake;3.22.1"

      - name: Copy vector icon fonts
        run: |
          mkdir -p android/app/src/main/assets/fonts
          cp node_modules/react-native-vector-icons/Fonts/*.ttf \
             android/app/src/main/assets/fonts/ 2>/dev/null || true

      - name: Create keystore
        run: |
          keytool -genkeypair -v \
            -keystore android/app/debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Build Debug APK
        working-directory: android
        env:
          JAVA_TOOL_OPTIONS: "-Xmx4g -XX:MaxMetaspaceSize=512m"
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log
          EXIT=${PIPESTATUS[0]}
          if [ $EXIT -ne 0 ]; then
            echo "=== ERRORS FOUND ==="
            grep -n "error:\|Error:\|FAILED\|Caused by:\|Could not\|what went wrong\|> Task" /tmp/build.log | tail -60 || true
            echo "=== LAST 200 LINES ==="
            tail -200 /tmp/build.log
            exit $EXIT
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DawaiApp-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          retention-days: 7

name: Build DAWAI APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Install Node deps
        run: npm install --legacy-peer-deps

      - name: Dump react-native config
        run: |
          npx react-native config > /tmp/rn-config.json 2>/tmp/rn-config-err.txt || true
          echo '=== Android packages found by autolinking ==='
          node -e "
            const cfg = require('/tmp/rn-config.json');
            const deps = cfg.dependencies || {};
            Object.entries(deps).forEach(([name, info]) => {
              const android = (info.platforms || {}).android;
              if (android) console.log(name + ': ' + (android.sourceDir || 'NO sourceDir'));
            });
          " 2>/dev/null || echo 'config parse failed'
          echo '=== Errors ==='
          cat /tmp/rn-config-err.txt | head -20

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.1.12297006"

      - name: Copy vector-icons fonts
        run: |
          mkdir -p android/app/src/main/assets/fonts
          cp node_modules/react-native-vector-icons/Fonts/*.ttf android/app/src/main/assets/fonts/ 2>/dev/null || true

      - name: Create keystore
        run: |
          keytool -genkeypair -v \
            -keystore android/app/debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log
          EXIT=${PIPESTATUS[0]}
          if [ $EXIT -ne 0 ]; then
            echo '=== PackageList.java ==='
            find . -name 'PackageList.java' -exec cat {} \;
            echo '=== ERRORS ==='
            grep -E 'error:|FAILURE|What went wrong|Caused by:' /tmp/build.log | head -50
            echo '=== LAST 100 LINES ==='
            tail -100 /tmp/build.log
            exit $EXIT
          fi
        env:
          JAVA_TOOL_OPTIONS: "-Xmx4g -XX:MaxMetaspaceSize=512m"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DawaiApp-debug-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

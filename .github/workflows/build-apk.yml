name: 🏗️ Build DAWAI APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Install deps
        run: npm install --legacy-peer-deps

      - name: Verify gradle plugin installed
        run: |
          if [ -d "node_modules/@react-native/gradle-plugin" ]; then
            echo "✅ @react-native/gradle-plugin found"
            ls node_modules/@react-native/gradle-plugin/
          else
            echo "❌ @react-native/gradle-plugin MISSING"
            ls node_modules/@react-native/ || true
          fi

      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Install SDK
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.1.12297006"

      - name: Setup files
        run: |
          KEY="${{ secrets.MAPS_API_KEY }}"
          [ -z "$KEY" ] && KEY="AIzaSyDummy_key"
          sed -i "s/YOUR_MAPS_API_KEY/$KEY/g" android/app/src/main/AndroidManifest.xml
          keytool -genkeypair -v -keystore android/app/debug.keystore \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android -dname "CN=Debug,O=Android,C=US"
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log || true

      - name: Save error to repo
        if: always()
        run: |
          if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "✅ BUILD SUCCESS — Run #${{ github.run_number }}" > build-error.log
          else
            {
              echo "Run #${{ github.run_number }}"
              echo "FAILURE: Build failed with an exception."
              echo "--- LAST 100 ---"
              tail -100 /tmp/build.log
            } > build-error.log
          fi
          git config user.email "ci@github.com"
          git config user.name "GitHub Actions"
          git pull --rebase origin main || true
          git add build-error.log
          git diff --cached --quiet || git commit -m "ci: build result #${{ github.run_number }} [ci skip]"
          git push origin main || true

      - name: Check result
        run: |
          if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "✅ APK جاهز"
          else
            grep -E "What went wrong|Caused by:|error:" /tmp/build.log | head -30 || true
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: DAWAI-debug-v${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

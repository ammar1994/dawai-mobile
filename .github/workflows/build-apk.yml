name: 🏗️ Build DAWAI APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: 📦 Install dependencies
        run: npm install --legacy-peer-deps

      - name: 🩹 Patch ReactSettingsExtension bug
        run: |
          FILE="node_modules/@react-native/gradle-plugin/settings-plugin/src/main/kotlin/com/facebook/react/ReactSettingsExtension.kt"
          [ -f "$FILE" ] && sed -i 's/.readText().substring(0, 1024)/.readText().take(1024)/g' "$FILE" && echo "✅ Patched"

      - name: 🔧 Patch codegen specs
        run: |
          find node_modules -type f \( -name "*.ts" -o -name "*.js" \) 2>/dev/null | \
            xargs grep -rl "WithDefault.*undefined\|accessibilityContainerViewIsModal" 2>/dev/null | \
            while read f; do
              sed -i '/accessibilityContainerViewIsModal/d' "$f"
              sed -i 's/WithDefault<boolean, undefined>/boolean/g' "$f"
              sed -i 's/WithDefault<string, undefined>/string/g' "$f"
            done
          echo "✅ Codegen patches done"

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: 📱 Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.1.12297006"

      - name: 🔥 Setup Firebase
        run: |
          [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ] && \
            echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json || \
            echo "⚠️ GOOGLE_SERVICES_JSON not set"

      - name: 🗺️ Maps API Key
        run: |
          [ -n "${{ secrets.MAPS_API_KEY }}" ] && \
            sed -i 's/YOUR_MAPS_API_KEY/${{ secrets.MAPS_API_KEY }}/g' android/app/src/main/AndroidManifest.xml || true

      - name: 🔑 Debug Keystore
        run: |
          keytool -genkeypair -v -keystore android/app/debug.keystore -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: 🛠️ local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: 📦 Download dependencies (trigger AAR caching)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew dependencies --no-daemon -q 2>/dev/null || true
          echo "✅ Dependencies downloaded"

      - name: 🩹 Patch react-android AAR (editTextBackgroundMode fix)
        run: |
          echo "=== البحث عن react-android AAR في Gradle cache ==="
          GRADLE_CACHE="$HOME/.gradle/caches"
          
          # ابحث عن الـ AAR
          AARS=$(find "$GRADLE_CACHE" -name "react-android*.aar" 2>/dev/null)
          echo "Found AARs:"
          echo "$AARS"
          
          # ابحث في كل الـ AARs وكذلك في أي XML في الـ cache
          find "$GRADLE_CACHE" -name "*.aar" 2>/dev/null | while read AAR; do
            if unzip -p "$AAR" "res/values/values.xml" 2>/dev/null | grep -q "editTextBackgroundMode"; then
              echo "  🎯 Found in: $AAR"
              # استخرج وصلح وأعد الضغط
              TMP=$(mktemp -d)
              cp "$AAR" "$TMP/orig.aar"
              cd "$TMP"
              unzip -q orig.aar
              if grep -q "editTextBackgroundMode" res/values/values.xml 2>/dev/null; then
                sed -i '/editTextBackgroundMode/d' res/values/values.xml
                echo "  ✅ Patched res/values/values.xml"
              fi
              # أعد الضغط
              zip -q -r patched.aar . -x "orig.aar"
              cp patched.aar "$AAR"
              echo "  ✅ AAR updated: $AAR"
              cd -
              rm -rf "$TMP"
            fi
          done
          
          # أيضاً ابحث في الـ exploded AARs
          find "$GRADLE_CACHE" -name "values.xml" 2>/dev/null | while read F; do
            if grep -q "editTextBackgroundMode" "$F" 2>/dev/null; then
              sed -i '/editTextBackgroundMode/d' "$F"
              echo "  ✅ Patched exploded: $F"
            fi
          done
          
          echo "✅ AAR patch complete"

      - name: 🏗️ Build Debug APK
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee /tmp/build.log
          echo "✅ BUILD SUCCESS"
          ls -lh app/build/outputs/apk/debug/

      - name: 💾 Save build error to repo
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            try {
              const full = fs.readFileSync('/tmp/build.log', 'utf8');
              const lines = full.split('\n');
              const errors = lines.filter(l => /FAILURE|Caused by:|What went wrong|error:|Exception/.test(l) && !/^\s*at /.test(l));
              const content = ['=== Run #' + context.runNumber + ' ===', '=== KEY ERRORS ===', ...errors.slice(0,40), '=== LAST 80 LINES ===', ...lines.slice(-80)].join('\n');
              const encoded = Buffer.from(content).toString('base64');
              let sha;
              try { const {data} = await github.rest.repos.getContent({owner: context.repo.owner, repo: context.repo.repo, path: 'build-error.log'}); sha = data.sha; } catch(e) {}
              await github.rest.repos.createOrUpdateFileContents({owner: context.repo.owner, repo: context.repo.repo, path: 'build-error.log', message: 'ci: build error #' + context.runNumber, content: encoded, ...(sha?{sha}:{})});
            } catch(e) { core.warning(e.message); }

      - name: 📤 Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DAWAI-debug-v${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: 📊 Summary
        if: always()
        run: |
          if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            SIZE=$(du -sh android/app/build/outputs/apk/debug/app-debug.apk | cut -f1)
            echo "✅ **APK جاهز** — $SIZE" >> $GITHUB_STEP_SUMMARY
            echo "📥 حمّل من تبويب **Artifacts**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ فشل البناء — راجع build-error.log" >> $GITHUB_STEP_SUMMARY
          fi

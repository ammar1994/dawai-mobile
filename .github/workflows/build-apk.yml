name: 🏗️ Build DAWAI APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Install deps
        run: npm install --legacy-peer-deps

      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Install SDK
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.1.12297006"

      - name: Setup files
        run: |
          # Maps key
          KEY="${{ secrets.MAPS_API_KEY }}"
          [ -z "$KEY" ] && KEY="AIzaSyDummy_key"
          sed -i "s/YOUR_MAPS_API_KEY/$KEY/g" android/app/src/main/AndroidManifest.xml
          # Keystore
          keytool -genkeypair -v -keystore android/app/debug.keystore \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android -dname "CN=Debug,O=Android,C=US"
          # local.properties
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          # google-services: استخدم الملف من المستودع دائماً (لا secrets)
          echo "✅ google-services.json:"
          cat android/app/google-services.json | python3 -c \
            "import sys,json; d=json.load(sys.stdin); [print(' -', c['client_info']['android_client_info']['package_name']) for c in d['client']]"

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          rm -rf $HOME/.gradle/wrapper/dists/gradle-8.7* || true
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log || true

      - name: Save build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: /tmp/build.log
          retention-days: 3

      - name: Check result
        run: |
          if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            SIZE=$(du -sh android/app/build/outputs/apk/debug/app-debug.apk | cut -f1)
            echo "✅ APK جاهز — $SIZE" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ BUILD FAILED" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -E "FAILURE|What went wrong|> " /tmp/build.log | head -30 >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -30 /tmp/build.log >> $GITHUB_STEP_SUMMARY || true
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: DAWAI-debug-v${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

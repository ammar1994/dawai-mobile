name: 🏗️ Build DAWAI APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: 📦 Install dependencies
        run: npm install --legacy-peer-deps

      - name: 🩹 Patch ReactSettingsExtension (substring bug)
        run: |
          EXT="node_modules/@react-native/gradle-plugin/settings-plugin/src/main/kotlin/com/facebook/react/ReactSettingsExtension.kt"
          [ -f "$EXT" ] && sed -i 's/\.readText()\.substring(0, 1024)/.readText().take(1024)/g' "$EXT" && echo "✅ Patched" || echo "⚠️ Not found"

      - name: 🤖 Setup Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: 📱 Install SDK + NDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.1.12297006" \
            "cmake;3.22.1"
          echo "✅ NDK: $(ls $ANDROID_HOME/ndk/ 2>/dev/null)"

      - name: 🔥 Setup Firebase google-services.json
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json
            echo "✅ Real google-services.json"
          else
            cat > android/app/google-services.json << 'JSON_EOF'
          {
            "project_info": {
              "project_number": "123456789000",
              "project_id": "dawai-pharmacy-debug",
              "storage_bucket": "dawai-pharmacy-debug.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:123456789000:android:abcdef1234567890",
                "android_client_info": { "package_name": "com.dawai.pharmacy" }
              },
              "oauth_client": [],
              "api_key": [{ "current_key": "AIzaSyDummy_key_for_debug_build_only" }],
              "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
            }],
            "configuration_version": "1"
          }
          JSON_EOF
            echo "⚠️ Using dummy google-services.json (package: com.dawai.pharmacy)"
          fi

      - name: 🗺️ Maps API Key
        run: |
          if [ -n "${{ secrets.MAPS_API_KEY }}" ]; then
            sed -i "s/YOUR_MAPS_API_KEY/${{ secrets.MAPS_API_KEY }}/g" android/app/src/main/AndroidManifest.xml
          else
            sed -i "s/YOUR_MAPS_API_KEY/AIzaSyDummy_maps_key/g" android/app/src/main/AndroidManifest.xml
          fi

      - name: 🔤 Copy vector-icons fonts
        run: |
          mkdir -p android/app/src/main/assets/fonts
          cp node_modules/react-native-vector-icons/Fonts/*.ttf android/app/src/main/assets/fonts/ 2>/dev/null || true
          echo "Fonts: $(ls android/app/src/main/assets/fonts/ | wc -l)"

      - name: 🔑 Create Debug Keystore
        run: |
          keytool -genkeypair -v \
            -keystore android/app/debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: 🛠️ Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/27.1.12297006" >> android/local.properties

      - name: 🏗️ Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log
          echo "✅ BUILD SUCCESS"
          ls -lh app/build/outputs/apk/debug/

      - name: ❌ Show errors on failure
        if: failure()
        run: |
          echo "====== LAST 120 LINES ======"
          tail -120 /tmp/build.log || true
          echo "====== KEY ERRORS ======"
          grep -E "error:|FAILURE|Caused by:|What went wrong|cannot find symbol|Exception" \
            /tmp/build.log | grep -v "^\s*at " | head -50 || true

      - name: 📤 Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DAWAI-debug-v${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: 📊 Build Summary
        if: always()
        run: |
          echo "## نتيجة البناء" >> $GITHUB_STEP_SUMMARY
          if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            SIZE=$(du -sh android/app/build/outputs/apk/debug/app-debug.apk | cut -f1)
            echo "✅ **APK جاهز — الحجم: $SIZE**" >> $GITHUB_STEP_SUMMARY
            echo "📥 حمّل من **Artifacts**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ فشل البناء" >> $GITHUB_STEP_SUMMARY
          fi

name: 🏗️ Build DAWAI APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: 📦 Install dependencies
        run: npm install --legacy-peer-deps

      - name: 🩹 Patch ReactSettingsExtension (substring bug)
        run: |
          FILE="node_modules/@react-native/gradle-plugin/settings-plugin/src/main/kotlin/com/facebook/react/ReactSettingsExtension.kt"
          if [ -f "$FILE" ]; then
            sed -i 's/.readText().substring(0, 1024)/.readText().take(1024)/g' "$FILE"
            echo "✅ Patched ReactSettingsExtension"
          else
            echo "ℹ️ Not found — skipping"
          fi

      - name: 🔧 Patch codegen specs (fix undefined prop types)
        run: |
          # Fix all packages that have undefined prop types in codegen specs
          for f in $(find node_modules -type f \( -name "*.ts" -o -name "*.js" \) \
                     -path "*/src/fabric/*" -o -path "*/src/specs/*" \
                     2>/dev/null | head -500); do
            if grep -q ": *undefined" "$f" 2>/dev/null; then
              sed -i 's/: *undefined/: boolean/g' "$f"
              echo "Patched type: $f"
            fi
          done
          # Also patch accessibilityContainerViewIsModal specifically
          for f in $(find node_modules/react-native-screens -type f \
                     \( -name "*.ts" -o -name "*.js" \) 2>/dev/null); do
            if grep -q "accessibilityContainerViewIsModal" "$f" 2>/dev/null; then
              sed -i '/accessibilityContainerViewIsModal/d' "$f"
              echo "Removed prop: $f"
            fi
          done
          echo "✅ Spec patching complete"

      - name: 🔍 Diagnose react-native config
        run: |
          echo "=== react-native config output ==="
          node node_modules/@react-native-community/cli/build/index.js config \
            > /tmp/rn-config.json 2>/tmp/rn-config-err.txt || true
          EXIT=$?
          echo "Exit code: $EXIT"
          if [ $EXIT -ne 0 ]; then
            echo "=== ERRORS ==="
            cat /tmp/rn-config-err.txt
          else
            echo "✅ Config OK"
            node -e "
              const fs = require('fs');
              const d = JSON.parse(fs.readFileSync('/tmp/rn-config.json','utf8'));
              const native = Object.entries(d.dependencies||{})
                .filter(([,v])=>v.platforms&&v.platforms.android);
              console.log('Android deps:', native.length);
              native.forEach(([k])=>console.log(' -', k));
            "
          fi

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: 📱 Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.1.12297006"

      - name: 🔥 Setup Firebase
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json
          else
            echo "⚠️ GOOGLE_SERVICES_JSON غير موجود"
          fi

      - name: 🗺️ Maps API Key
        run: |
          if [ -n "${{ secrets.MAPS_API_KEY }}" ]; then
            sed -i 's/YOUR_MAPS_API_KEY/${{ secrets.MAPS_API_KEY }}/g' android/app/src/main/AndroidManifest.xml
          fi

      - name: 🔤 Copy fonts
        run: |
          mkdir -p android/app/src/main/assets/fonts
          cp node_modules/react-native-vector-icons/Fonts/*.ttf android/app/src/main/assets/fonts/ 2>/dev/null || true

      - name: 🔑 Debug Keystore
        run: |
          keytool -genkeypair -v -keystore android/app/debug.keystore -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: 🛠️ local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: 🏗️ Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "=== KEY ERRORS ==="
            grep -E "(^error:|FAILED|Caused by:|Unknown prop|does not exist|Exception)" \
              /tmp/build.log | tail -40 || true
            exit $BUILD_EXIT
          fi
          echo "✅ BUILD SUCCESS"
          ls -lh app/build/outputs/apk/debug/

      - name: 📤 Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DAWAI-debug-v${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: 📊 Build Summary
        if: always()
        run: |
          echo "## نتيجة البناء" >> $GITHUB_STEP_SUMMARY
          if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            SIZE=$(du -sh android/app/build/outputs/apk/debug/app-debug.apk | cut -f1)
            echo "✅ **APK جاهز** — الحجم: $SIZE" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ فشل البناء" >> $GITHUB_STEP_SUMMARY
          fi

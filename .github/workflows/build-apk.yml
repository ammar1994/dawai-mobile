name: Build DAWAI APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: temurin }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install deps
        run: npm install --legacy-peer-deps
      - name: Fix gradle-plugin
        run: |
          P="node_modules/@react-native/gradle-plugin"
          [ -f "$P/settings.gradle" ] || [ -f "$P/settings.gradle.kts" ] || \
            echo "rootProject.name = 'react-native-gradle-plugin'" > "$P/settings.gradle"
      - uses: android-actions/setup-android@v3
        with: { accept-android-sdk-licenses: 'true' }
      - name: Install SDK + NDK
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.1.12297006"
      - name: Fonts + keystore + local.properties
        run: |
          mkdir -p android/app/src/main/assets/fonts
          cp node_modules/react-native-vector-icons/Fonts/*.ttf android/app/src/main/assets/fonts/ 2>/dev/null || true
          [ -f android/app/debug.keystore ] || keytool -genkeypair -v \
            -keystore android/app/debug.keystore -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
      - name: Build APK
        working-directory: android
        env:
          JAVA_TOOL_OPTIONS: "-Xmx4g -XX:MaxMetaspaceSize=512m"
        run: |
          export PATH="$(dirname $(which node)):$PATH"
          echo "✓ Node: $(node --version)"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon 2>&1 | tee /tmp/build.log
          EXIT=${PIPESTATUS[0]}
          if [ $EXIT -ne 0 ]; then
            ERRS=$(grep -E "error:|What went wrong|Caused by:" /tmp/build.log | head -15 | tr '\n' ' | ')
            echo "::error::$ERRS"
            grep -E "error:|What went wrong|Caused by:|cannot find|does not exist" /tmp/build.log | head -30
            tail -60 /tmp/build.log
            exit 1
          fi
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DawaiApp-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
      - name: Upload log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          retention-days: 7

name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Verify patch applied
        run: |
          echo "=== react-native-screens fabric fix ==="
          grep "onAttached" node_modules/react-native-screens/src/fabric/ScreenStackHeaderConfigNativeComponent.ts
          echo "✅ No '| undefined' in DirectEventHandler types"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.1.12297006"

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Create debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore android/app/debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Copy vector-icons fonts
        run: |
          mkdir -p android/app/src/main/assets/fonts
          cp node_modules/react-native-vector-icons/Fonts/*.ttf \
             android/app/src/main/assets/fonts/ 2>/dev/null || true

      - name: Build Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/build.log
        env:
          JAVA_TOOL_OPTIONS: "-Xmx4g -XX:MaxMetaspaceSize=512m"

      - name: Show build error (on failure)
        if: failure()
        run: |
          echo "==============================="
          echo "❌ BUILD FAILED"
          echo "==============================="
          if [ -f /tmp/build.log ]; then
            grep -n "error\|Error\|FAILED\|Exception\|Caused by\|Could not\|what went wrong" \
              /tmp/build.log | tail -80
            echo ""
            echo "=== Last 100 lines ==="
            tail -100 /tmp/build.log
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: /tmp/build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Find and copy APK
        if: success()
        run: |
          echo "=== Full build outputs tree ==="
          find android/app/build -type f \( -name "*.apk" -o -name "*.aab" \) 2>/dev/null || true
          echo ""
          echo "=== outputs/ directory ==="
          ls -la android/app/build/outputs/ 2>/dev/null || echo "No outputs dir"
          ls -laR android/app/build/outputs/apk/ 2>/dev/null || echo "No apk dir"
          echo ""
          APK=$(find android/app/build -name "*.apk" 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            echo "⚠️ No APK — checking for AAB (bundle)"
            AAB=$(find android/app/build -name "*.aab" 2>/dev/null | head -1)
            if [ -n "$AAB" ]; then
              echo "✅ Found AAB: $AAB — copying as DawaiApp.aab"
              cp "$AAB" DawaiApp.aab
            else
              echo "❌ Neither APK nor AAB found"
              exit 1
            fi
          else
            echo "✅ Found APK: $APK ($(du -sh "$APK" | cut -f1))"
            cp "$APK" DawaiApp.apk
          fi

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "DawaiApp Build #${{ github.run_number }}"
          body: |
            🤖 Automated build from commit ${{ github.sha }}
            
            **Changes:** ${{ github.event.head_commit.message }}
          files: |
            DawaiApp.apk
            DawaiApp.aab
          fail_on_unmatched_files: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

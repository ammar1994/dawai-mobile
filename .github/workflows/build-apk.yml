name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Verify codegen patch
        run: |
          grep "onAttached" \
            node_modules/react-native-screens/src/fabric/ScreenStackHeaderConfigNativeComponent.ts
          echo "✅ Patch applied — no '| undefined' in DirectEventHandler"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.1.12297006"

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Create debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore android/app/debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Copy vector-icons fonts
        run: |
          mkdir -p android/app/src/main/assets/fonts
          cp node_modules/react-native-vector-icons/Fonts/*.ttf \
             android/app/src/main/assets/fonts/ 2>/dev/null || true

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log
        env:
          JAVA_TOOL_OPTIONS: "-Xmx4g -XX:MaxMetaspaceSize=512m"

      - name: Show build error (on failure)
        if: failure()
        run: |
          echo "=== BUILD FAILED ==="
          if [ -f /tmp/build.log ]; then
            grep -n "error\|Error\|FAILED\|Exception\|Caused by\|Could not" \
              /tmp/build.log | tail -60
            echo "--- last 80 lines ---"
            tail -80 /tmp/build.log
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: /tmp/build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Find APK
        if: success()
        run: |
          echo "=== build outputs ==="
          find android/app/build/outputs -type f 2>/dev/null | head -30 || echo "No outputs dir"
          APK=$(find android/app/build/outputs -name "*.apk" 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            echo "❌ No APK found"
            exit 1
          fi
          SIZE=$(du -sh "$APK" | cut -f1)
          echo "✅ APK: $APK ($SIZE)"
          cp "$APK" DawaiApp-debug.apk

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DawaiApp-debug-${{ github.run_number }}
          path: DawaiApp-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "DawaiApp Debug Build #${{ github.run_number }}"
          body: |
            🤖 Automated build from commit ${{ github.sha }}
            **${{ github.event.head_commit.message }}**
          files: DawaiApp-debug.apk
          fail_on_unmatched_files: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

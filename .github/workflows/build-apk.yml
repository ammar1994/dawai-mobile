name: Build DAWAI APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK + NDK components
        run: |
          sdkmanager \
            "build-tools;34.0.0" \
            "build-tools;35.0.0" \
            "platforms;android-34" \
            "platforms;android-35" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1"
          echo "NDK_PATH=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "CMAKE_PATH=$ANDROID_SDK_ROOT/cmake/3.22.1/bin" >> $GITHUB_ENV

      - name: Create local.properties with NDK path
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          echo "ndk.dir=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> android/local.properties
          echo "cmake.dir=$ANDROID_SDK_ROOT/cmake/3.22.1" >> android/local.properties
          cat android/local.properties

      - name: Fix gradle-wrapper.jar
        run: |
          JAR="node_modules/react-native/template/android/gradle/wrapper/gradle-wrapper.jar"
          cp "$JAR" android/gradle/wrapper/gradle-wrapper.jar
          cp "$JAR" node_modules/@react-native/gradle-plugin/gradle/wrapper/gradle-wrapper.jar

      - name: Copy vector-icons fonts
        run: |
          mkdir -p android/app/src/main/assets/fonts
          cp node_modules/react-native-vector-icons/Fonts/*.ttf \
             android/app/src/main/assets/fonts/ 2>/dev/null || true

      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore android/app/debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Debug APK
        working-directory: android
        env:
          JAVA_TOOL_OPTIONS: "-Xmx4g -XX:MaxMetaspaceSize=512m"
          ANDROID_NDK_HOME: ${{ env.NDK_PATH }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DawaiApp-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

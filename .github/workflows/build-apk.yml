name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Node dependencies
        run: npm install

      - name: Fix foojay plugin in gradle-plugin settings
        run: |
          python3 - << 'PY'
          content = 'pluginManagement {\n  repositories {\n    mavenCentral()\n    google()\n    gradlePluginPortal()\n  }\n}\nrootProject.name = "react-native-gradle-plugin"\n'
          with open('node_modules/@react-native/gradle-plugin/settings.gradle.kts', 'w') as f:
              f.write(content)
          print("Fixed settings.gradle.kts")
          PY

      - name: Pre-build React Native Gradle Plugin
        run: |
          JAR="node_modules/react-native/template/android/gradle/wrapper/gradle-wrapper.jar"
          cp "$JAR" node_modules/@react-native/gradle-plugin/gradle/wrapper/gradle-wrapper.jar
          cd node_modules/@react-native/gradle-plugin
          chmod +x gradlew
          ./gradlew jar --no-daemon -Dorg.gradle.jvmargs="-Xmx2g" 2>&1 | tail -5
          echo "Plugin build result: $?"

      - name: Copy gradle files
        run: |
          cp node_modules/react-native/template/android/gradle/wrapper/gradle-wrapper.jar \
             android/gradle/wrapper/gradle-wrapper.jar
          cp node_modules/react-native/template/android/gradlew android/gradlew
          chmod +x android/gradlew

      - name: Setup debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore android/app/debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=512m" \
            -Dorg.gradle.daemon=false

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DawaiApp-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

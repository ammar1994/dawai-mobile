name: 🏗️ Build DAWAI APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: 📦 Install dependencies
        run: npm install --legacy-peer-deps

      - name: 🩹 Patch ReactSettingsExtension
        run: |
          EXT_FILE="node_modules/@react-native/gradle-plugin/settings-plugin/src/main/kotlin/com/facebook/react/ReactSettingsExtension.kt"
          if [ -f "$EXT_FILE" ]; then
            sed -i 's/\.readText()\.substring(0, 1024)/.readText().take(1024)/g' "$EXT_FILE"
            sed -i 's/readText()\.substring(0, 1024)/readText().take(1024)/g' "$EXT_FILE"
            echo "✅ Patched"
          fi

      - name: 🔍 Debug react-native config output
        run: |
          echo "=== react-native config ==="
          node node_modules/@react-native-community/cli/build/index.js config 2>/dev/null | \
          python3 -c "
          import sys, json
          try:
              content = sys.stdin.read()
              start = content.find('{')
              if start >= 0:
                  d = json.loads(content[start:])
                  android = d.get('project', {}).get('android', {})
                  print('packageName:', android.get('packageName', 'NOT FOUND'))
                  print('applicationId:', android.get('applicationId', 'NOT FOUND'))
                  print('sourceDir:', android.get('sourceDir', 'NOT FOUND'))
              else:
                  print('No JSON found')
                  print(content[:300])
          except Exception as e:
              print('Error:', e)
          "

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: 📱 Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.1.12297006"

      - name: 🔥 Setup Firebase
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json
          else
            cat > android/app/google-services.json << 'JSON_EOF'
          {
            "project_info": {
              "project_number": "123456789000",
              "project_id": "dawai-app-debug",
              "storage_bucket": "dawai-app-debug.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:123456789000:android:abcdef1234567890",
                "android_client_info": { "package_name": "com.dawaiapp" }
              },
              "oauth_client": [],
              "api_key": [{ "current_key": "AIzaSyDummy_key_for_debug_build_only" }],
              "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
            }],
            "configuration_version": "1"
          }
          JSON_EOF
          fi

      - name: 🗺️ Maps API Key
        run: |
          if [ -n "${{ secrets.MAPS_API_KEY }}" ]; then
            sed -i "s/YOUR_MAPS_API_KEY/${{ secrets.MAPS_API_KEY }}/g" android/app/src/main/AndroidManifest.xml
          fi

      - name: 🔤 Copy fonts
        run: |
          mkdir -p android/app/src/main/assets/fonts
          cp node_modules/react-native-vector-icons/Fonts/*.ttf android/app/src/main/assets/fonts/ 2>/dev/null || true

      - name: 🔑 Debug Keystore
        run: |
          keytool -genkeypair -v \
            -keystore android/app/debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: 🛠️ local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: 🏗️ Build Debug APK
        id: build
        working-directory: android
        continue-on-error: true
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: 📋 Print Full Build Errors
        if: always()
        run: |
          echo "=== FULL BUILD LOG TAIL ==="
          tail -100 /tmp/build.log || true
          echo ""
          echo "=== KEY ERRORS ==="
          grep -E "FAILURE|Caused by:|What went wrong|Exception|error:|Error:" /tmp/build.log \
            | grep -v "^\s*at " | head -50 || true

      - name: 📤 Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-v${{ github.run_number }}
          path: /tmp/build.log
          retention-days: 7

      - name: ❌ Fail if build failed
        if: steps.build.outputs.exit_code != '0'
        run: exit 1

      - name: 📤 Upload APK
        if: steps.build.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: DAWAI-debug-v${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: 📊 Build Summary
        if: always()
        run: |
          echo "## نتيجة البناء" >> $GITHUB_STEP_SUMMARY
          if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            SIZE=$(du -sh android/app/build/outputs/apk/debug/app-debug.apk | cut -f1)
            echo "✅ **APK جاهز** — الحجم: $SIZE" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ فشل البناء — راجع artifact **build-log**" >> $GITHUB_STEP_SUMMARY
          fi

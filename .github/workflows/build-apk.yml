name: DAWAI EAS Build

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    name: EAS Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install EAS CLI
        run: npm install -g eas-cli@latest

      - name: Build APK via EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build --platform android --profile preview --non-interactive --wait --message "Build #${{ github.run_number }}"

      - name: Get APK URL
        if: success()
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build:list --platform android --limit 1 --non-interactive --json > /tmp/eas-builds.json
          cat /tmp/eas-builds.json
          APK_URL=$(python3 -c "import json; builds=json.load(open('/tmp/eas-builds.json')); print(builds[0].get('artifacts',{}).get('buildUrl','') if builds else '')")
          echo "APK_URL=$APK_URL" >> $GITHUB_ENV
          echo "APK URL: $APK_URL"

      - name: Upload to GitHub Release
        if: success() && env.APK_URL != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -L -o dawai-v${{ github.run_number }}.apk "${{ env.APK_URL }}"
          OLD_ID=$(curl -s -H "Authorization: token $GH_TOKEN" "https://api.github.com/repos/${{ github.repository }}/releases/tags/latest-build" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))" || echo "")
          if [ -n "$OLD_ID" ] && [ "$OLD_ID" != "None" ]; then
            curl -s -X DELETE -H "Authorization: token $GH_TOKEN" "https://api.github.com/repos/${{ github.repository }}/releases/$OLD_ID" || true
            curl -s -X DELETE -H "Authorization: token $GH_TOKEN" "https://api.github.com/repos/${{ github.repository }}/git/refs/tags/latest-build" || true
            sleep 2
          fi
          RELEASE=$(curl -s -X POST -H "Authorization: token $GH_TOKEN" -H "Content-Type: application/json" "https://api.github.com/repos/${{ github.repository }}/releases" -d "{\"tag_name\":\"latest-build\",\"name\":\"DAWAI Build #${{ github.run_number }}\",\"prerelease\":true}")
          UPLOAD_URL=$(echo "$RELEASE" | python3 -c "import sys,json; print(json.load(sys.stdin)['upload_url'].split('{')[0])")
          curl -s -X POST -H "Authorization: token $GH_TOKEN" -H "Content-Type: application/vnd.android.package-archive" --data-binary @"dawai-v${{ github.run_number }}.apk" "${UPLOAD_URL}?name=dawai-v${{ github.run_number }}.apk"
          echo "APK رُفع على GitHub Releases"

      - name: Save build result
        if: always()
        run: |
          if [ -n "${{ env.APK_URL }}" ]; then
            printf "SUCCESS Build #${{ github.run_number }}\nAPK: ${{ env.APK_URL }}\n" > build-error.log
          else
            printf "FAILED Build #${{ github.run_number }}\n" > build-error.log
          fi
          git config user.email "ci@github.com"
          git config user.name "GitHub Actions"
          git pull --rebase origin main || true
          git add build-error.log
          git diff --cached --quiet || git commit -m "ci: build result #${{ github.run_number }} [ci skip]"
          git push origin main || true

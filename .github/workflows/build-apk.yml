name: 🏗️ Build DAWAI APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: 📦 Install dependencies
        run: npm install --legacy-peer-deps

      - name: 🩹 Patch ReactSettingsExtension (substring bug)
        run: |
          FILE="node_modules/@react-native/gradle-plugin/settings-plugin/src/main/kotlin/com/facebook/react/ReactSettingsExtension.kt"
          if [ -f "$FILE" ]; then
            sed -i 's/.readText().substring(0, 1024)/.readText().take(1024)/g' "$FILE"
            echo "✅ Patched ReactSettingsExtension"
          fi

      - name: 🔧 Patch codegen specs (undefined prop types)
        run: |
          echo "=== Searching ALL files for accessibilityContainerViewIsModal ==="
          find node_modules -type f 2>/dev/null \
            | xargs grep -rl "accessibilityContainerViewIsModal" 2>/dev/null \
            | while read f; do
                sed -i '/accessibilityContainerViewIsModal/d' "$f"
                echo "  Patched: $f"
              done
          echo ""
          echo "=== Searching for WithDefault.*undefined codegen bug ==="
          find node_modules -type f \( -name "*.ts" -o -name "*.tsx" -o -name "*.js" \) 2>/dev/null \
            | xargs grep -rl "WithDefault.*undefined" 2>/dev/null \
            | while read f; do
                sed -i 's/WithDefault<boolean, undefined>/boolean/g' "$f"
                sed -i 's/WithDefault<string, undefined>/string/g' "$f"
                echo "  Fixed WithDefault: $f"
              done
          echo "✅ Codegen spec patching complete"

      - name: 🔍 Verify react-native config
        run: |
          set +e
          node node_modules/@react-native-community/cli/build/index.js config \
            > /tmp/rn-config.json 2>/tmp/rn-config-err.txt
          EXIT=$?
          set -e
          echo "Exit code: $EXIT"
          if [ $EXIT -ne 0 ]; then
            echo "::warning::react-native config failed (exit $EXIT)"
            cat /tmp/rn-config-err.txt | head -30
          else
            BYTES=$(wc -c < /tmp/rn-config.json)
            echo "✅ Config OK — $BYTES bytes"
            node -e "
              try {
                var d=JSON.parse(require('fs').readFileSync('/tmp/rn-config.json','utf8'));
                var n=Object.keys(d.dependencies||{}).filter(function(k){
                  return d.dependencies[k].platforms&&d.dependencies[k].platforms.android;
                });
                console.log('Android native deps: '+n.length);
                n.forEach(function(k){console.log('  - '+k);});
              } catch(e){console.log('parse err:'+e.message);}
            " || true
          fi

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: 📱 Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.1.12297006"

      - name: 🔥 Setup Firebase
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json
          else
            echo "⚠️ GOOGLE_SERVICES_JSON غير موجود"
          fi

      - name: 🗺️ Maps API Key
        run: |
          if [ -n "${{ secrets.MAPS_API_KEY }}" ]; then
            sed -i 's/YOUR_MAPS_API_KEY/${{ secrets.MAPS_API_KEY }}/g' android/app/src/main/AndroidManifest.xml
          fi

      - name: 🔤 Copy fonts
        run: |
          mkdir -p android/app/src/main/assets/fonts
          cp node_modules/react-native-vector-icons/Fonts/*.ttf android/app/src/main/assets/fonts/ 2>/dev/null || true

      - name: 🔑 Debug Keystore
        run: |
          keytool -genkeypair -v -keystore android/app/debug.keystore -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: 🛠️ local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: 🏗️ Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          if [ $BUILD_EXIT -ne 0 ]; then
            echo ""
            echo "=== KEY ERRORS ==="
            grep -E "(^error:|FAILED$|Caused by:|Unknown prop|does not exist|Exception:)" \
              /tmp/build.log | grep -v "^$" | head -50 || true
            exit $BUILD_EXIT
          fi
          echo "✅ BUILD SUCCESS"
          ls -lh app/build/outputs/apk/debug/

      - name: 📋 Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-v${{ github.run_number }}
          path: /tmp/build.log
          retention-days: 7

      - name: 📤 Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DAWAI-debug-v${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: 📊 Build Summary
        if: always()
        run: |
          echo "## نتيجة البناء" >> $GITHUB_STEP_SUMMARY
          if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            SIZE=$(du -sh android/app/build/outputs/apk/debug/app-debug.apk | cut -f1)
            echo "✅ **APK جاهز** — الحجم: $SIZE" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ فشل البناء — راجع build-log artifact" >> $GITHUB_STEP_SUMMARY
          fi

name: 🏗️ Build DAWAI APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: 📦 Install dependencies
        run: npm install --legacy-peer-deps

      - name: 🩹 Patch ReactSettingsExtension
        run: |
          FILE="node_modules/@react-native/gradle-plugin/settings-plugin/src/main/kotlin/com/facebook/react/ReactSettingsExtension.kt"
          [ -f "$FILE" ] && sed -i 's/.readText().substring(0, 1024)/.readText().take(1024)/g' "$FILE"

      - name: 🔧 Patch codegen
        run: |
          find node_modules -type f \( -name "*.ts" -o -name "*.js" \) 2>/dev/null | \
            xargs grep -rl "WithDefault.*undefined\|accessibilityContainerViewIsModal" 2>/dev/null | \
            while read f; do
              sed -i '/accessibilityContainerViewIsModal/d;s/WithDefault<boolean, undefined>/boolean/g;s/WithDefault<string, undefined>/string/g' "$f"
            done

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: 📱 SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.1.12297006"

      - name: 🔥 Firebase
        run: |
          [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ] && \
            echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json || true

      - name: 🔑 Keystore + local.properties
        run: |
          keytool -genkeypair -v -keystore android/app/debug.keystore -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: 🔍 Diagnose — run mergeDebugResources + find source
        working-directory: android
        run: |
          chmod +x gradlew
          # شغّل فقط mergeDebugResources
          ./gradlew mergeDebugResources --no-daemon -q 2>/dev/null || true
          
          echo "=== البحث في build intermediates ==="
          # ابحث عن الملف المدمج
          MERGED=$(find app/build/intermediates -name "values.xml" 2>/dev/null | head -5)
          echo "Merged XML files:"
          echo "$MERGED"
          
          echo ""
          echo "=== محتوى حول السطر 436 في كل ملف ==="
          find app/build/intermediates -name "values.xml" 2>/dev/null | while read F; do
            if grep -q "editTextBackgroundMode" "$F" 2>/dev/null; then
              echo "🎯 FOUND in: $F"
              grep -n "editTextBackgroundMode" "$F"
              echo "--- Context (lines 430-442) ---"
              sed -n '430,442p' "$F"
              # ما قبل وبعد السطر
              LINE=$(grep -n "editTextBackgroundMode" "$F" | head -1 | cut -d: -f1)
              if [ -n "$LINE" ]; then
                START=$((LINE - 15))
                END=$((LINE + 5))
                echo "--- Style context (lines $START-$END) ---"
                sed -n "${START},${END}p" "$F"
              fi
            fi
          done
          
          echo ""
          echo "=== ابحث عن الـ style المسبب ==="
          find app/build -name "*.xml" 2>/dev/null | xargs grep -l "editTextBackgroundMode" 2>/dev/null

      - name: 💾 Save diagnostic to repo
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { execSync } = require('child_process');
            try {
              // ابحث عن الملف المدمج
              const files = execSync('find /home/runner/work/dawai-mobile/dawai-mobile/android/app/build/intermediates -name "values.xml" 2>/dev/null', {encoding:'utf8'}).trim().split('\n').filter(Boolean);
              let diag = 'Files: ' + files.join(', ') + '\n\n';
              for (const f of files) {
                const content = require('fs').readFileSync(f, 'utf8');
                if (content.includes('editTextBackgroundMode')) {
                  diag += '=== FOUND IN: ' + f + ' ===\n';
                  const lines = content.split('\n');
                  const idx = lines.findIndex(l => l.includes('editTextBackgroundMode'));
                  const start = Math.max(0, idx-20);
                  const end = Math.min(lines.length, idx+5);
                  diag += lines.slice(start, end).map((l,i)=>(start+i+1)+': '+l).join('\n');
                  diag += '\n';
                }
              }
              const encoded = Buffer.from(diag).toString('base64');
              let sha;
              try { const {data} = await github.rest.repos.getContent({owner:context.repo.owner, repo:context.repo.repo, path:'merge-diag.txt'}); sha=data.sha; } catch(e) {}
              await github.rest.repos.createOrUpdateFileContents({owner:context.repo.owner, repo:context.repo.repo, path:'merge-diag.txt', message:'diag: merged values.xml analysis', content:encoded, ...(sha?{sha}:{})});
              core.info('✅ Saved to merge-diag.txt');
            } catch(e) { core.warning(e.message); }

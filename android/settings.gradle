pluginManagement {
    includeBuild("../node_modules/@react-native/gradle-plugin")
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id("com.facebook.react.settings")
}

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
    // Explicitly set node executable path for CI environments
    // where PATH may not include node during Gradle config phase
    def nodeCmd = System.getenv("NODE") ?: "node"
    ex.autolinkLibrariesFromCommand(
        nodeCmd,
        ["--no-warnings",
         "./node_modules/@react-native-community/cli/build/bin.js",
         "config"]
    )
}

rootProject.name = 'DawaiApp'
include ':app'

buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion    = 24
        compileSdkVersion = 35
        targetSdkVersion = 35
        ndkVersion       = "27.1.12297006"
        kotlinVersion    = "1.9.24"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.6.1")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:${kotlinVersion}")
        classpath("com.google.gms:google-services:4.4.2")
    }
}

apply plugin: "com.facebook.react.rootproject"

// Force Material 1.12.0 across ALL subprojects to fix:
// android:attr/editTextBackgroundMode not found (removed from API 35)
subprojects {
    configurations.all {
        resolutionStrategy.eachDependency { DependencyResolveDetails details ->
            if (details.requested.group == "com.google.android.material"
                    && details.requested.name == "material") {
                details.useVersion "1.12.0"
            }
            if (details.requested.group == "androidx.appcompat"
                    && details.requested.name == "appcompat") {
                details.useVersion "1.7.0"
            }
        }
    }
}


plugins {
    id("com.android.application")
    id("org.jetbrains.kotlin.android")
    id("com.facebook.react")
}

react {
    // Required: adds all autolinked native libraries to the build classpath
    autolinkLibrariesWithApp()
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    namespace "com.dawaiapp"
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.dawaiapp"
        minSdk         rootProject.ext.minSdkVersion
        targetSdk      rootProject.ext.targetSdkVersion
        versionCode    1
        versionName    "1.0.0"
        vectorDrawables.useSupportLibrary = true

        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }
    }

    signingConfigs {
        debug {
            storeFile      file("debug.keystore")
            storePassword "android"
            keyAlias       "androiddebugkey"
            keyPassword   "android"
        }
        release {
            if (project.hasProperty("DAWAI_UPLOAD_STORE_FILE")) {
                storeFile      file(DAWAI_UPLOAD_STORE_FILE)
                storePassword  DAWAI_UPLOAD_STORE_PASSWORD
                keyAlias       DAWAI_UPLOAD_KEY_ALIAS
                keyPassword    DAWAI_UPLOAD_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled       true
            shrinkResources     true
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
            pickFirsts += [
                'lib/x86/libc++_shared.so',
                'lib/x86_64/libc++_shared.so',
                'lib/armeabi-v7a/libc++_shared.so',
                'lib/arm64-v8a/libc++_shared.so'
            ]
        }
    }
}

dependencies {
    // React Native core — autolinkLibrariesWithApp() adds native libs above
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:hermes-android")
    implementation "org.jetbrains.kotlin:kotlin-stdlib:${rootProject.ext.kotlinVersion}"

    // Google Maps
    implementation "com.google.android.gms:play-services-maps:18.2.0"
    implementation "com.google.android.gms:play-services-location:21.2.0"
}

// react-native-vector-icons fonts
apply from: file("../../node_modules/react-native-vector-icons/fonts.gradle")

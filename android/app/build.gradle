apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    hermesEnabled = true
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion
    namespace "com.dawai.pharmacy"

    defaultConfig {
        applicationId "com.dawai.pharmacy"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
        buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", "false"
        buildConfigField "boolean", "IS_HERMES_ENABLED", "true"
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.debug }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    packaging {
        jniLibs {
            pickFirsts += [
                'lib/x86/libc++_shared.so',
                'lib/x86_64/libc++_shared.so',
                'lib/armeabi-v7a/libc++_shared.so',
                'lib/arm64-v8a/libc++_shared.so',
            ]
        }
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
            ]
        }
    }
}

dependencies {
    // React Native core
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:hermes-android")
    // Splash screen
    implementation("androidx.core:core-splashscreen:1.0.1")

    // ─── Native module dependencies (autolinking gap fix) ───────────────
    // RN 0.76 generates PackageList.java with these imports but does NOT
    // automatically add implementation project() — we must do it manually.
    implementation project(':d11_react_native_fast_image')
    implementation project(':notifee_react_native')
    implementation project(':react_native_async_storage_async_storage')
    implementation project(':react_native_community_geolocation')
    implementation project(':react_native_community_netinfo')
    implementation project(':react_native_bootsplash')
    implementation project(':react_native_gesture_handler')
    implementation project(':react_native_image_picker')
    implementation project(':react_native_linear_gradient')
    implementation project(':react_native_permissions')
    implementation project(':react_native_safe_area_context')
    implementation project(':react_native_screens')
    implementation project(':react_native_vector_icons')
}

apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

// Google Services: فقط عند وجود ملف حقيقي
def gsFile = file("google-services.json")
if (gsFile.exists()) {
    def gsJson = new groovy.json.JsonSlurper().parse(gsFile)
    if (gsJson.project_info.project_number != "000000000000") {
        apply plugin: "com.google.gms.google-services"
    }
}

react {
    // autolinking يتولى كل شيء تلقائياً — لا تعدّل
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    namespace "com.dawaiapp"
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.dawaiapp"
        minSdk         rootProject.ext.minSdkVersion
        targetSdk      rootProject.ext.targetSdkVersion
        versionCode    1
        versionName    "1.0.0"
        vectorDrawables.useSupportLibrary = true
    }

    signingConfigs {
        debug {
            storeFile      file("debug.keystore")
            storePassword "android"
            keyAlias       "androiddebugkey"
            keyPassword   "android"
        }
        release {
            if (project.hasProperty("DAWAI_UPLOAD_STORE_FILE")) {
                storeFile      file(DAWAI_UPLOAD_STORE_FILE)
                storePassword  DAWAI_UPLOAD_STORE_PASSWORD
                keyAlias       DAWAI_UPLOAD_KEY_ALIAS
                keyPassword    DAWAI_UPLOAD_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled       true
            shrinkResources     true
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // React Native core — autolinking يضيف المكتبات الأخرى تلقائياً
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:hermes-android")
    implementation "org.jetbrains.kotlin:kotlin-stdlib:${rootProject.ext.kotlinVersion}"

    // Firebase BOM
    implementation platform("com.google.firebase:firebase-bom:33.7.0")
    implementation "com.google.firebase:firebase-messaging"
    implementation "com.google.firebase:firebase-analytics"

    // Google Maps
    implementation "com.google.android.gms:play-services-maps:18.2.0"
    implementation "com.google.android.gms:play-services-location:21.2.0"
}

// react-native-vector-icons fonts
apply from: file("../../node_modules/react-native-vector-icons/fonts.gradle")

apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: "com.google.gms.google-services"

react {
    // React Native autolinking
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    namespace "com.dawaiapp"
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.dawai.pharmacy"
        minSdk         rootProject.ext.minSdkVersion
        targetSdk      rootProject.ext.targetSdkVersion
        versionCode    1
        versionName    "1.0.0"
    }

    signingConfigs {
        debug {
            storeFile      file("debug.keystore")
            storePassword "android"
            keyAlias       "androiddebugkey"
            keyPassword   "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled       true
            shrinkResources     true
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

configurations.all {
    resolutionStrategy {
        force 'androidx.appcompat:appcompat:1.6.1'
        force 'androidx.appcompat:appcompat-resources:1.6.1'
        force 'androidx.core:core:1.12.0'
        force 'androidx.core:core-ktx:1.12.0'
    }
}

dependencies {
    // React Native core
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:hermes-android")
    implementation "org.jetbrains.kotlin:kotlin-stdlib:${rootProject.ext.kotlinVersion}"

    // Firebase
    implementation platform("com.google.firebase:firebase-bom:33.7.0")
    implementation "com.google.firebase:firebase-messaging"
    implementation "com.google.firebase:firebase-analytics"

    // Google Maps & Location
    implementation "com.google.android.gms:play-services-maps:18.2.0"
    implementation "com.google.android.gms:play-services-location:21.2.0"

    // React Native Libraries (explicit dependencies for autolinking)
    implementation project(':d11_react-native-fast-image')
    implementation project(':notifee_react-native')
    implementation project(':react-native-community_datetimepicker')
    implementation project(':react-native-firebase_app')
    implementation project(':react-native-firebase_messaging')
    implementation project(':lottie-react-native')
    implementation project(':react-native-bootsplash')
    implementation project(':react-native-gesture-handler')
    implementation project(':react-native-image-picker')
    implementation project(':react-native-linear-gradient')
    implementation project(':react-native-maps')
    implementation project(':react-native-mmkv')
    implementation project(':react-native-permissions')
    implementation project(':react-native-safe-area-context')
    implementation project(':react-native-screens')
    implementation project(':react-native-vector-icons')
}

apply from: file("../../node_modules/react-native-vector-icons/fonts.gradle")

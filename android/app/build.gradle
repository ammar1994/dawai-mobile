apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: "com.google.gms.google-services"

react {
    // الإعدادات الافتراضية — لا تعدّل إلا إذا غيرت موقع index.js
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    namespace "com.dawaiapp"
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.dawaiapp"
        minSdk         rootProject.ext.minSdkVersion
        targetSdk      rootProject.ext.targetSdkVersion
        versionCode    1
        versionName    "1.0.0"
        vectorDrawables.useSupportLibrary = true
    }

    signingConfigs {
        debug {
            storeFile      file("debug.keystore")
            storePassword "android"
            keyAlias       "androiddebugkey"
            keyPassword   "android"
        }
        release {
            if (project.hasProperty("DAWAI_UPLOAD_STORE_FILE")) {
                storeFile      file(DAWAI_UPLOAD_STORE_FILE)
                storePassword  DAWAI_UPLOAD_STORE_PASSWORD
                keyAlias       DAWAI_UPLOAD_KEY_ALIAS
                keyPassword    DAWAI_UPLOAD_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled       true
            shrinkResources     true
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:hermes-android")

    implementation "org.jetbrains.kotlin:kotlin-stdlib:${rootProject.ext.kotlinVersion}"

    implementation platform("com.google.firebase:firebase-bom:33.7.0")
    implementation "com.google.firebase:firebase-messaging"
    implementation "com.google.firebase:firebase-analytics"

    implementation "com.google.android.gms:play-services-maps:18.2.0"
    implementation "com.google.android.gms:play-services-location:21.2.0"
}

configurations.all {
    resolutionStrategy {
        force 'androidx.core:core:1.13.1'
        force 'androidx.core:core-ktx:1.13.1'
        force 'androidx.appcompat:appcompat:1.7.0'
    }
}

apply from: file("../../node_modules/react-native-vector-icons/fonts.gradle")


// Fix: android:attr/editTextBackgroundMode not found (known RN 0.76.x bug)
// يُزيل الـ attribute من الـ merged resources بعد الدمج وقبل AAPT2
afterEvaluate {
    def mergeTask = tasks.findByName("mergeDebugResources")
    if (mergeTask) {
        mergeTask.doLast {
            fileTree(buildDir).matching {
                include "**/intermediates/**/*.xml"
                include "**/merged_res/**/*.xml"
            }.each { f ->
                if (f.text.contains("editTextBackgroundMode")) {
                    def orig = f.text
                    f.text = orig.replaceAll(/(?m).*editTextBackgroundMode.*\n?/, "")
                    println "  ✅ Patched: ${f.path}"
                }
            }
        }
    }
}

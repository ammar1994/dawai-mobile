<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول — دوائي Admin</title>
<link rel="stylesheet" href="admin.css">
<style>
body { background: linear-gradient(135deg, #1E1E2D 0%, #2D1B3E 100%); display: flex; align-items: center; justify-content: center; min-height: 100vh; }
.login-card { background: #fff; border-radius: 20px; padding: 40px 36px; width: 380px; max-width: 95vw; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
.login-logo { text-align: center; margin-bottom: 28px; }
.login-logo .icon { font-size: 42px; }
.login-logo h1 { font-size: 28px; font-weight: 800; color: var(--primary); letter-spacing: 1px; margin-top: 6px; }
.login-logo p { color: var(--text-muted); font-size: 13px; }
.login-title { font-size: 17px; font-weight: 700; color: var(--dark); margin-bottom: 22px; text-align: center; }
.error-msg { background: #FEE2E2; color: #DC2626; padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; display: none; }
</style>
</head>
<body>
<div class="login-card">
  <div class="login-logo">
    <div class="icon">💊</div>
    <h1>DAWAI</h1>
    <p>لوحة تحكم الصيدلية</p>
  </div>
  <p class="login-title">تسجيل دخول المشرف</p>
  <div class="error-msg" id="errorMsg"></div>
  <div class="form-group">
    <label class="form-label">البريد الإلكتروني</label>
    <input class="form-control" type="email" id="email" placeholder="admin@pharmacy.com">
  </div>
  <div class="form-group">
    <label class="form-label">كلمة المرور</label>
    <input class="form-control" type="password" id="password" placeholder="••••••••">
  </div>
  <button class="btn btn-primary w-full" style="width:100%;justify-content:center;padding:12px;" id="loginBtn" onclick="doLogin()">
    🔐 دخول
  </button>
  <p style="text-align:center;font-size:11px;color:var(--text-muted);margin-top:16px;">DAWAI Pharmacy SaaS © 2024</p>
</div>
<script src="admin.js"></script>
<script>
async function doLogin() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('loginBtn');
  const err = document.getElementById('errorMsg');
  err.style.display = 'none';
  if (!email || !password) { err.textContent = 'يرجى تعبئة جميع الحقول'; err.style.display = 'block'; return; }
  btn.textContent = '...جاري تسجيل الدخول'; btn.disabled = true;
  try {
    const data = await apiCall('/admin/auth/login', {
      method: 'POST',
      body: JSON.stringify({ email, password }),
    });
    if (data && data.success) {
      Auth.setToken(data.data.accessToken);
      Auth.setUser(data.data.admin);
      window.location.href = 'index.html';
    } else {
      err.textContent = data?.message || 'بيانات غير صحيحة';
      err.style.display = 'block';
    }
  } catch (e) {
    // Demo mode — bypass for development
    Auth.setToken('demo-token-123');
    Auth.setUser({ name: 'مشرف النظام', email });
    window.location.href = 'index.html';
  }
  btn.textContent = '🔐 دخول'; btn.disabled = false;
}
document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
// Already logged in?
if (Auth.getToken()) window.location.href = 'index.html';
</script>
</body>
</html>
